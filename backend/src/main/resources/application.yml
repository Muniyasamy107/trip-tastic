server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: trip-tastic-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/triptastic?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:tripuser}
    password: ${DB_PASSWORD:tripsecret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
